<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
  </style>
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=x2ia0bht2o"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    // TODO: 우송대학교 서캠퍼스 실제 중심 좌표로 조정하세요.
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(36.3249, 127.4162),
      zoom: 17
    });

    var buildingMarkers = [];
    var myLocationMarker = null;
    var routePolyline = null;
    var hasCenteredOnMyLocation = false;
    var currentHeading = 0;

    function myLocationIconHtml(heading) {
      return '' +
        '<div style="position:relative;width:44px;height:44px;transform:rotate(' + heading + 'deg);transform-origin:50% 50%;">' +
          '<div style="position:absolute;top:0;left:0;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle, rgba(43,125,233,0.35) 0%, rgba(43,125,233,0.12) 60%, rgba(43,125,233,0) 100%);"></div>' +
          '<div style="position:absolute;top:0;left:14px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid rgba(43,125,233,0.9);"></div>' +
          '<div style="position:absolute;top:14px;left:14px;width:16px;height:16px;border-radius:8px;background:#2b7de9;border:3px solid white;box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>' +
        '</div>';
    }

    function postToApp(message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      }
    }

    function renderBuildings(buildings) {
      buildingMarkers.forEach(function (m) { m.setMap(null); });
      buildingMarkers = [];
      buildings.forEach(function (b) {
        var marker = new naver.maps.Marker({
          position: new naver.maps.LatLng(b.lat, b.lng),
          map: map,
          title: b.name
        });
        naver.maps.Event.addListener(marker, 'click', function () {
          postToApp({ type: 'buildingClick', building: b });
        });
        buildingMarkers.push(marker);
      });
    }

    function renderMyLocation(loc) {
      var position = new naver.maps.LatLng(loc.lat, loc.lng);
      if (myLocationMarker) {
        myLocationMarker.setPosition(position);
      } else {
        myLocationMarker = new naver.maps.Marker({
          position: position,
          map: map,
          icon: {
            content: myLocationIconHtml(currentHeading),
            anchor: new naver.maps.Point(22, 22)
          },
          zIndex: 100
        });
      }

      if (!hasCenteredOnMyLocation) {
        hasCenteredOnMyLocation = true;
        map.setCenter(position);
      }
    }

    function renderHeading(heading) {
      currentHeading = heading;
      if (myLocationMarker) {
        myLocationMarker.setIcon({
          content: myLocationIconHtml(currentHeading),
          anchor: new naver.maps.Point(22, 22)
        });
      }
    }

    function renderRoute(points) {
      if (routePolyline) {
        routePolyline.setMap(null);
        routePolyline = null;
      }
      if (!points || points.length < 2) return;
      routePolyline = new naver.maps.Polyline({
        map: map,
        path: points.map(function (p) { return new naver.maps.LatLng(p.lat, p.lng); }),
        strokeColor: '#2b7de9',
        strokeWeight: 5,
        strokeOpacity: 0.9
      });
    }

    function handleMessage(event) {
      try {
        var data = JSON.parse(event.data);
        if (data.type === 'buildings') {
          renderBuildings(data.buildings);
        } else if (data.type === 'location') {
          renderMyLocation(data);
        } else if (data.type === 'heading') {
          renderHeading(data.heading);
        } else if (data.type === 'centerOnLocation') {
          map.setCenter(new naver.maps.LatLng(data.lat, data.lng));
        } else if (data.type === 'route') {
          renderRoute(data.points);
        }
      } catch (e) {
        // ignore malformed messages
      }
    }

    // Android WebView는 document로, iOS는 window로 메시지를 보낸다.
    document.addEventListener('message', handleMessage);
    window.addEventListener('message', handleMessage);
  </script>
</body>
</html>
