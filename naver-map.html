<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
    #map { transition: filter 0.25s ease; }
  </style>
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=x2ia0bht2o"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    // TODO: 우송대학교 서캠퍼스 실제 중심 좌표로 조정하세요.
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(36.3249, 127.4162),
      zoom: 17
    });

    var buildingMarkers = [];
    var myLocationMarker = null;
    var routePolyline = null;
    var hasCenteredOnMyLocation = false;
    var currentHeading = 0;
    var isDarkMode = false;
    var DARK_FILTER = 'invert(100%) hue-rotate(180deg) brightness(0.95) contrast(0.92)';
    var lastBuildings = [];
    var BASE_ZOOM = 17;
    var BASE_CIRCLE_SIZE = 32; // 기준 줌(17)에서의 원형 아이콘 지름(px)

    var PICTOGRAM_BASE = 'https://qktkska-oss.github.io/everyroad-map-assets/pictograms/';
    var buildingIcons = {
      '학생회관': '학생회관.png',
      '유학생기숙사': '유학생기숙사.png',
      '국제교육센터': '국제교육센터.png',
      '학군단': '학군단.png',
      '철도 물류관': '철도물류관.png',
      '도서관': '도서관.png',
      '보건의료과학관': '보건의료과학관.png',
      '교양교육관': '교양교육관.png',
      '우송유치원': '우송유치원.png',
      '사회복지 융합관': '사회복지융합관.png',
      '우송예술회관': '우송예술회관.png',
      '미디어융합관': '미디어융합관.png',
      '우송타워': '우송타워.png',
      '식품건축관': '식품건축관.png',
      '우송대학교 서문': '우송대학교서문.png',
      '우송대학교 동문': '우송대학교서문.png',
      '우송대학교 북문': '우송대학교서문.png'
    };

    function currentIconScale() {
      // 줌 레벨 한 칸당 25%씩 커지고 작아지도록 지수적으로 계산 (지도 축소 시 확실히 작아지게).
      var zoom = map.getZoom();
      var scale = Math.pow(1.25, zoom - BASE_ZOOM);
      if (scale < 0.28) scale = 0.28;
      if (scale > 1.6) scale = 1.6;
      return scale;
    }

    function buildingPinIconHtml(iconFile) {
      var scale = currentIconScale();
      var circleSize = Math.round(BASE_CIRCLE_SIZE * scale);
      var tailHeight = Math.round(circleSize * 0.24);
      var tailWidth = Math.round(circleSize * 0.16);
      var totalHeight = circleSize + tailHeight;
      return '' +
        '<div style="position:relative;width:' + circleSize + 'px;height:' + totalHeight + 'px;">' +
          '<img src="' + PICTOGRAM_BASE + encodeURIComponent(iconFile) + '" ' +
            'style="position:absolute;top:0;left:0;width:' + circleSize + 'px;height:' + circleSize + 'px;' +
            'border-radius:50%;border:2px solid #ffffff;box-shadow:0 2px 5px rgba(0,0,0,0.35);" />' +
          '<div style="position:absolute;top:' + (circleSize - 2) + 'px;left:' + (circleSize / 2 - tailWidth / 2) + 'px;' +
            'width:0;height:0;border-left:' + (tailWidth / 2) + 'px solid transparent;border-right:' + (tailWidth / 2) + 'px solid transparent;' +
            'border-top:' + tailHeight + 'px solid #ffffff;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3));"></div>' +
        '</div>';
    }

    function buildingMarkerAnchor(iconFile) {
      var scale = currentIconScale();
      var circleSize = Math.round(BASE_CIRCLE_SIZE * scale);
      var tailHeight = Math.round(circleSize * 0.24);
      return new naver.maps.Point(circleSize / 2, circleSize + tailHeight);
    }

    function myLocationIconHtml(heading) {
      // 다크모드일 때 지도 전체에 걸린 반전 필터를 이 마커 안에서만 되돌려서
      // 파란 점이 반전되지 않고 원래 색 그대로 보이게 한다.
      var counterFilter = isDarkMode ? 'filter:' + DARK_FILTER + ';' : '';
      return '' +
        '<div style="' + counterFilter + 'position:relative;width:44px;height:44px;transform:rotate(' + heading + 'deg);transform-origin:50% 50%;">' +
          '<div style="position:absolute;top:0;left:0;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle, rgba(43,125,233,0.35) 0%, rgba(43,125,233,0.12) 60%, rgba(43,125,233,0) 100%);"></div>' +
          '<div style="position:absolute;top:0;left:14px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid rgba(43,125,233,0.9);"></div>' +
          '<div style="box-sizing:border-box;position:absolute;top:14px;left:14px;width:16px;height:16px;border-radius:8px;background:#2b7de9;border:3px solid white;box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>' +
        '</div>';
    }

    function postToApp(message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      }
    }

    function renderBuildings(buildings) {
      lastBuildings = buildings || [];
      buildingMarkers.forEach(function (m) { m.marker.setMap(null); });
      buildingMarkers = [];
      lastBuildings.forEach(function (b) {
        var iconFile = buildingIcons[b.name];
        var markerOptions = {
          position: new naver.maps.LatLng(b.lat, b.lng),
          map: map,
          title: b.name
        };
        if (iconFile) {
          markerOptions.icon = {
            content: buildingPinIconHtml(iconFile),
            anchor: buildingMarkerAnchor(iconFile)
          };
        }
        var marker = new naver.maps.Marker(markerOptions);
        naver.maps.Event.addListener(marker, 'click', function () {
          postToApp({ type: 'buildingClick', building: b });
        });
        buildingMarkers.push({ marker: marker, iconFile: iconFile });
      });
    }

    function refreshBuildingIconSizes() {
      buildingMarkers.forEach(function (entry) {
        if (!entry.iconFile) return;
        entry.marker.setIcon({
          content: buildingPinIconHtml(entry.iconFile),
          anchor: buildingMarkerAnchor(entry.iconFile)
        });
      });
    }

    function renderMyLocation(loc) {
      var position = new naver.maps.LatLng(loc.lat, loc.lng);
      if (myLocationMarker) {
        myLocationMarker.setPosition(position);
      } else {
        myLocationMarker = new naver.maps.Marker({
          position: position,
          map: map,
          icon: {
            content: myLocationIconHtml(currentHeading),
            anchor: new naver.maps.Point(22, 22)
          },
          zIndex: 100
        });
      }

      if (!hasCenteredOnMyLocation) {
        hasCenteredOnMyLocation = true;
        map.setCenter(position);
      }
    }

    function renderHeading(heading) {
      currentHeading = heading;
      if (myLocationMarker) {
        myLocationMarker.setIcon({
          content: myLocationIconHtml(currentHeading),
          anchor: new naver.maps.Point(22, 22)
        });
      }
    }

    function renderTheme(dark) {
      isDarkMode = !!dark;
      var mapEl = document.getElementById('map');
      mapEl.style.filter = isDarkMode ? DARK_FILTER : '';
      // 마커 아이콘의 되돌림 필터도 갱신
      if (myLocationMarker) {
        myLocationMarker.setIcon({
          content: myLocationIconHtml(currentHeading),
          anchor: new naver.maps.Point(22, 22)
        });
      }
    }

    function renderRoute(points, color) {
      if (routePolyline) {
        routePolyline.setMap(null);
        routePolyline = null;
      }
      if (!points || points.length < 2) return;
      routePolyline = new naver.maps.Polyline({
        map: map,
        path: points.map(function (p) { return new naver.maps.LatLng(p.lat, p.lng); }),
        strokeColor: color || '#2b7de9',
        strokeWeight: 5,
        strokeOpacity: 0.9
      });
    }

    // 지도를 확대/축소할 때마다 건물 픽토그램 크기를 같이 조절한다.
    // (zoom_changed 하나만 걸면 SDK/버전에 따라 안 잡히는 경우가 있어 idle까지 이중으로 건다)
    var lastAppliedZoom = null;
    function handleZoomMaybeChanged() {
      var zoom = map.getZoom();
      if (zoom === lastAppliedZoom) return;
      lastAppliedZoom = zoom;
      refreshBuildingIconSizes();
    }
    naver.maps.Event.addListener(map, 'zoom_changed', handleZoomMaybeChanged);
    naver.maps.Event.addListener(map, 'idle', handleZoomMaybeChanged);

    function handleMessage(event) {
      try {
        var data = JSON.parse(event.data);
        if (data.type === 'buildings') {
          renderBuildings(data.buildings);
        } else if (data.type === 'location') {
          renderMyLocation(data);
        } else if (data.type === 'heading') {
          renderHeading(data.heading);
        } else if (data.type === 'centerOnLocation') {
          map.setCenter(new naver.maps.LatLng(data.lat, data.lng));
        } else if (data.type === 'route') {
          renderRoute(data.points, data.color);
        } else if (data.type === 'theme') {
          renderTheme(data.dark);
        }
      } catch (e) {
        // ignore malformed messages
      }
    }

    // Android WebView는 document로, iOS는 window로 메시지를 보낸다.
    document.addEventListener('message', handleMessage);
    window.addEventListener('message', handleMessage);
  </script>
</body>
</html>
